version: '3.8'

services:
  # Optional: PostgreSQL database (if you prefer over SQLite)
  db:
    image: postgres:15-alpine
    container_name: tokenflow-db
    environment:
      POSTGRES_USER: tokenflow
      POSTGRES_PASSWORD: tokenflow
      POSTGRES_DB: tokenflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching and session storage (optional)
  redis:
    image: redis:7-alpine
    container_name: tokenflow-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

# 如需使用命名卷，可取消下面的注释
# volumes:
#   postgres_data:
#   redis_data:
